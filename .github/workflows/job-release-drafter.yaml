name: Release Drafter
# Keeps the draft release notes current on every push to main. Releasing is
# tagging only: the maintainer publishes the draft by hand, which creates the
# vX.Y.Z tag. Nothing is bumped, committed back or published to a registry.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update_release_draft:
    name: 📝 Update Release Draft
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Draft release notes
        uses: Bugs5382/release-drafter-action@b7bedb08e209733bb916afe7e55637a047c3e7c0 # main, recreated after the history scrub
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
